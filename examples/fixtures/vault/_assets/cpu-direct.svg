<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="title desc"><title id="title">CPU 직결 경로</title><desc id="desc">CPU → 장치. 연결 관계만 나타내며 실제 배선·Lane 수·성능을 표시하지 않는다.</desc><rect width="640" height="200" fill="#f7f7f5"/><text x="32" y="42" font-family="sans-serif" font-size="24" fill="#15191c">CPU 직결 경로</text><rect x="32" y="65" width="576" height="70" rx="8" fill="none" stroke="#006f8f" stroke-width="2"/><text x="55" y="109" font-family="sans-serif" font-size="24" fill="#15191c">CPU → 장치</text><text x="32" y="174" font-family="sans-serif" font-size="18" fill="#15191c">개념적 연결 · 실물 배선과 대역폭 측정 아님</text></svg>
